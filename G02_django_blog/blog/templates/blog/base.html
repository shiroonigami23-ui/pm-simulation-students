<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>{% block title %}BlogForge{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="{% url 'post_list' %}">BlogForge</a>
  <div class="ms-auto">
    {% if user.is_authenticated %}
      <a href="{% url 'post_create' %}" class="btn btn-sm btn-outline-light me-2">New Post</a>
      <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-danger">Logout</a>
    {% else %}
      <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">Login</a>
    {% endif %}
  </div>
</nav>
<div class="container mt-4">{% block content %}{% endblock %}</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
