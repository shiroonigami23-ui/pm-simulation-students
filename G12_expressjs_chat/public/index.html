<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>ChatFlow</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,sans-serif;display:flex;height:100vh;background:#1e1e2e;color:#cdd6f4}
  #sidebar{width:220px;background:#181825;padding:1rem;border-right:1px solid #313244}
  #main{flex:1;display:flex;flex-direction:column}
  #messages{flex:1;overflow-y:auto;padding:1rem}
  .msg{margin-bottom:.8rem;padding:.6rem 1rem;border-radius:8px;max-width:70%}
  .msg.mine{background:#313244;margin-left:auto}
  .msg.other{background:#1e1e2e;border:1px solid #313244}
  .msg .meta{font-size:.75rem;color:#a6adc8;margin-bottom:.2rem}
  #input-area{padding:1rem;border-top:1px solid #313244;display:flex;gap:.5rem}
  #input-area input{flex:1;background:#313244;border:none;color:#cdd6f4;padding:.6rem 1rem;border-radius:6px}
  #input-area button{background:#89b4fa;color:#1e1e2e;border:none;padding:.6rem 1.2rem;border-radius:6px;cursor:pointer;font-weight:600}
</style>
</head><body>
<div id="sidebar">
  <h3 style="margin-bottom:1rem;color:#89b4fa">ChatFlow</h3>
  <div id="room-list"></div>
</div>
<div id="main">
  <div id="messages"></div>
  <div id="input-area">
    <input type="text" id="msg-input" placeholder="Type a message..." />
    <button onclick="sendMsg()">Send</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
  // Simple demo client — auth token hardcoded for dev
  const socket = io({ auth: { token: localStorage.getItem('token') || 'demo' } });
  const msgs   = document.getElementById('messages');
  const input  = document.getElementById('msg-input');

  socket.emit('join_room', { roomId:'general', userId:'demo-user', username:'DevUser' });

  socket.on('message_history', (history) => {
    history.forEach(m => addMessage(m.senderName, m.content, false));
  });

  socket.on('new_message', (m) => {
    addMessage(m.senderName, m.content, m.senderId === 'demo-user');
  });

  function addMessage(sender, text, mine) {
    const div = document.createElement('div');
    div.className = 'msg ' + (mine ? 'mine' : 'other');
    div.innerHTML = `<div class="meta">${sender}</div><div>${text}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function sendMsg() {
    const content = input.value.trim();
    if (!content) return;
    socket.emit('send_message', { roomId:'general', content, senderId:'demo-user', senderName:'DevUser' });
    input.value = '';
  }

  input.addEventListener('keypress', e => { if (e.key==='Enter') sendMsg(); });
</script>
</body></html>
