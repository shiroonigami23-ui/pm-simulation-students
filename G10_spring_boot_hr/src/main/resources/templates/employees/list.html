<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Employees — HRFlow</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<nav class="navbar navbar-dark bg-dark px-4">
  <a class="navbar-brand fw-bold" href="/employees">HRFlow</a>
  <a href="/employees/new" class="btn btn-sm btn-outline-light ms-auto">+ Add Employee</a>
</nav>
<div class="container mt-4">
  <div class="d-flex justify-content-between mb-3">
    <h1>Employees</h1>
    <form th:action="@{/employees}" method="get" class="d-flex gap-2">
      <input type="text" name="search" class="form-control" placeholder="Search by name" th:value="${search}">
      <button class="btn btn-outline-secondary">Search</button>
    </form>
  </div>
  <table class="table table-hover">
    <thead><tr><th>Name</th><th>Department</th><th>Job Title</th><th>Email</th><th>Salary</th><th></th></tr></thead>
    <tbody>
      <tr th:each="e : ${employees}">
        <td th:text="${e.name}"></td>
        <td th:text="${e.department}"></td>
        <td th:text="${e.jobTitle}"></td>
        <td th:text="${e.email}"></td>
        <td th:text="'$' + ${#numbers.formatDecimal(e.salary,1,'COMMA',0,'POINT')}"></td>
        <td>
          <a th:href="@{/employees/{id}/edit(id=${e.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
          <form th:action="@{/employees/{id}/deactivate(id=${e.id})}" method="post" style="display:inline">
            <button class="btn btn-sm btn-outline-danger">Remove</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
