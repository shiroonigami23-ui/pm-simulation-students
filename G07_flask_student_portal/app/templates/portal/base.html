<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<title>{% block title %}EduPortal{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body>
<nav class="navbar navbar-dark bg-primary px-4">
  <a class="navbar-brand fw-bold" href="{{ url_for('portal.dashboard') }}">EduPortal</a>
  <div class="ms-auto">
    <span class="text-white me-3">{{ current_user.name }}</span>
    <a href="{{ url_for('auth.logout') }}" class="btn btn-sm btn-outline-light">Logout</a>
  </div>
</nav>
<div class="container mt-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
