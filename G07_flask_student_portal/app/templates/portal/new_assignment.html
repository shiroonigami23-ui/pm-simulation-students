{% extends "portal/base.html" %}
{% block title %}New Assignment{% endblock %}
{% block content %}
<h1 class="mb-3">Add Assignment</h1>
<form method="post" style="max-width:500px">
  <div class="mb-3"><label class="form-label">Title *</label>
    <input type="text" name="title" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">Subject</label>
    <input type="text" name="subject" class="form-control"></div>
  <div class="mb-3"><label class="form-label">Description</label>
    <textarea name="description" class="form-control" rows="3"></textarea></div>
  <div class="mb-3"><label class="form-label">Due Date</label>
    <input type="date" name="due_date" class="form-control"></div>
  <button type="submit" class="btn btn-primary">Add</button>
  <a href="{{ url_for('portal.dashboard') }}" class="btn btn-secondary ms-2">Cancel</a>
</form>
{% endblock %}
